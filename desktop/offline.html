<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KnowMeBro — Connection needed</title>
  <style>
    :root { color-scheme: dark; font-family: Segoe UI, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; color: #f4f6ff; }
    main { width: min(520px, calc(100% - 40px)); text-align: center; }
    .mark { width: 70px; height: 70px; display: grid; place-items: center; margin: 0 auto 22px; border-radius: 22px; background: #7c3aed; font-size: 34px; }
    h1 { margin: 0 0 12px; font-size: 30px; }
    p { color: #b9c0d4; line-height: 1.65; }
    button { margin-top: 14px; border: 0; border-radius: 12px; padding: 13px 22px; background: #8b5cf6; color: white; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🧠</div>
    <h1>You’re offline</h1>
    <p>KnowMeBro needs an internet connection to open your quizzes and account. Check your connection, then try again.</p>
    <button type="button" onclick="location.href='https://knowmebro.onrender.com/'">Try again</button>
  </main>
</body>
</html>
