name: Build KnowMeBro for Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer and portable EXE
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Package Windows downloads
        run: npm run desktop:dist

      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: KnowMeBro-Windows-Downloads
          path: |
            release/KnowMeBro-Setup-*.exe
            release/KnowMeBro-Portable-*.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Attach Windows downloads to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: KnowMeBro-Windows-Downloads
          path: release

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/KnowMeBro-Setup-*.exe
            release/KnowMeBro-Portable-*.exe
          generate_release_notes: true
